cluster.name: "es-lab"
node.name: "{{NODE_NAME}}"
path.logs: /var/log/elasticsearch
path.data: /var/lib/elasticsearch

discovery.seed_hosts: ["es01", "es02"]
cluster.initial_master_nodes: ["es01", "es02"]

node.roles: [master, data, ingest]

network.host: [_site_, _local_]

node.attr.fault_domain: 1
node.attr.update_domain: 1
cluster.routing.allocation.awareness.attributes: fault_domain,update_domain

action.auto_create_index: .security*,.monitoring*,.kibana*,.watches,.triggered_watches,.watcher-history*,.logstash_dead_letter,.ml*,ccd-logstash-dead-letter
xpack.security.enabled: false
xpack.watcher.enabled: false
xpack.ml.enabled: false
xpack.monitoring.collection.enabled: false
xpack.apm_data.enabled: false
xpack.security.transport.ssl.enabled: false
xpack.security.http.ssl.enabled: false

script.allowed_types: inline
script.allowed_contexts: template, ingest, ingest_template, processor_conditional

ingest.geoip.downloader.enabled: false
bootstrap.memory_lock: true

path.repo: ["/usr/share/elasticsearch/backup"]